[project]
name = "proxie"
version = "0.1.0"
description = "Agent-native platform connecting skilled service providers with consumers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Proxie Team"}
]
keywords = ["ai", "agents", "services", "mcp", "marketplace"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "__pycache__"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py311"

# Full E/I/N/W/UP style rules never passed on this tree (2000+ findings).
# Quality CI gates on pyflakes (F) only: undefined names, unused, syntax.
[tool.ruff.lint]
select = ["F"]
# Existing unused imports/vars are widespread; do not block Quality CI.
ignore = ["F401", "F841", "F811", "F541"]
